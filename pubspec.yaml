name: wburger_pos
description: "W Burger POS - Point of Sale Terminal Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  gap: ^3.0.1
  uuid: ^4.4.0
  ffi: ^2.2.0

  # Web DOM APIs (used by web printer backend)
  web: '>=0.5.0 <2.0.0'

  # Image
  image_picker: ^1.1.2

  # QR / Camera
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Icons
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.5
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
    image_path: "assets/logos/wburger_windows_icon.png"
    icon_size: 256
  macos:
    generate: true
  linux: true
  image_path: "assets/logos/logo_yellow.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/

  fonts:
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-Regular.ttf
          weight: 400
        - asset: assets/fonts/BalooBhaijaan2-Medium.ttf
          weight: 500
        - asset: assets/fonts/BalooBhaijaan2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BalooBhaijaan2-Bold.ttf
          weight: 700
        - asset: assets/fonts/BalooBhaijaan2-ExtraBold.ttf
          weight: 800
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
