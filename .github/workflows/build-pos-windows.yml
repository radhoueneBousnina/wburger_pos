name: Build POS Windows Installer

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production backend origin used by the POS app"
        required: true
        default: "https://w-burger.com"
      pos_printer_names:
        description: "Optional comma-separated Windows receipt printer names"
        required: false
        default: ""
      cash_drawer_status_port:
        description: "Optional Windows COM port for physical-key drawer status, for example COM3"
        required: false
        default: ""
      cash_drawer_open_when_pin3_high:
        description: "Whether pin 3 high means drawer open for the connected printer"
        required: true
        default: "true"

jobs:
  build-windows:
    name: Build Windows x64 POS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze POS app
        run: flutter analyze

      - name: Run POS production smoke tests
        run: >
          flutter test
          test/receipt_printer_service_test.dart
          test/cart_state_test.dart
          test/windows_fullscreen_shortcuts_test.dart

      - name: Build Windows release
        shell: pwsh
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          POS_PRINTER_NAMES: ${{ inputs.pos_printer_names }}
          CASH_DRAWER_STATUS_PORT: ${{ inputs.cash_drawer_status_port }}
          CASH_DRAWER_OPEN_WHEN_PIN3_HIGH: ${{ inputs.cash_drawer_open_when_pin3_high }}
        run: |
          $buildArgs = @(
            "build"
            "windows"
            "--release"
            "--dart-define=API_BASE_URL=$env:API_BASE_URL"
            "--dart-define=POS_PRINTER_NAMES=$env:POS_PRINTER_NAMES"
            "--dart-define=CASH_DRAWER_STATUS_PORT=$env:CASH_DRAWER_STATUS_PORT"
            "--dart-define=CASH_DRAWER_OPEN_WHEN_PIN3_HIGH=$env:CASH_DRAWER_OPEN_WHEN_PIN3_HIGH"
          )
          & flutter @buildArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter Windows release build failed with exit code $LASTEXITCODE"
          }

      - name: Validate baked production API URL
        shell: pwsh
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $appSo = "$releaseDir\data\app.so"
          if (-not (Test-Path $appSo -PathType Leaf)) {
            throw "Required Windows release file is missing: $appSo"
          }

          $appText = [System.Text.Encoding]::Latin1.GetString(
            [System.IO.File]::ReadAllBytes($appSo)
          )

          if (-not $appText.Contains($env:API_BASE_URL)) {
            throw "The Windows build does not contain API_BASE_URL=$env:API_BASE_URL"
          }

          $forbiddenUrls = @(
            "http://localhost:8000"
            "http://127.0.0.1:8000"
            "http://10.0.2.2:8000"
          )
          foreach ($url in $forbiddenUrls) {
            if ($appText.Contains($url)) {
              throw "The Windows build still contains forbidden development API URL: $url"
            }
          }

          $buildInfo = [ordered]@{
            apiBaseUrl = $env:API_BASE_URL
            gitSha = $env:GITHUB_SHA
            builtAtUtc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $buildInfo |
            ConvertTo-Json |
            Set-Content -Path "$releaseDir\wburger_pos_build_info.json" -Encoding UTF8

          Write-Host "Verified Windows POS API base URL: $env:API_BASE_URL"

      - name: Validate Windows release bundle
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $requiredFiles = @(
            "$releaseDir\wburger_pos.exe"
            "$releaseDir\flutter_windows.dll"
            "$releaseDir\data\app.so"
            "$releaseDir\data\icudtl.dat"
            "$releaseDir\data\flutter_assets\AssetManifest.bin"
            "$releaseDir\wburger_pos_build_info.json"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Required Windows release file is missing: $file"
            }
          }

      - name: Download Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $runtimePath = "installer\vc_redist.x64.exe"
          Invoke-WebRequest `
            -Uri "https://aka.ms/vc14/vc_redist.x64.exe" `
            -OutFile $runtimePath
          $signature = Get-AuthenticodeSignature $runtimePath
          if ($signature.Status -ne "Valid" -or
              $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "Downloaded Visual C++ runtime does not have a valid Microsoft signature"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build installer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          $versionMatch = Select-String `
            -Path "pubspec.yaml" `
            -Pattern '^version:\s*(?<version>[0-9]+\.[0-9]+\.[0-9]+)' |
            Select-Object -First 1
          if ($null -eq $versionMatch) {
            throw "Could not read the application version from pubspec.yaml"
          }
          $appVersion = $versionMatch.Matches[0].Groups["version"].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$appVersion" `
            "installer\wburger_pos.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $installer = "installer-output\W-Burger-POS-Setup.exe"
          if (-not (Test-Path $installer -PathType Leaf) -or
              (Get-Item $installer).Length -lt 1MB) {
            throw "The Windows installer was not generated correctly"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: W-Burger-POS-Installer
          path: installer-output/W-Burger-POS-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: W-Burger-POS-Release-Bundle
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14
