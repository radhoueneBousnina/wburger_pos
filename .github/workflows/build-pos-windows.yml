name: Build POS Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 POS
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create ZIP package
        shell: pwsh
        run: |
          $releasePath = "build\windows\x64\runner\Release"
          $zipPath = "wburger-pos-windows-x64.zip"

          if (!(Test-Path $releasePath)) {
            Write-Error "Release folder not found: $releasePath"
            exit 1
          }

          Compress-Archive -Path "$releasePath\*" -DestinationPath $zipPath -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wburger-pos-windows-x64
          path: wburger-pos-windows-x64.zip
          retention-days: 14