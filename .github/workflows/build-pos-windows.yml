name: Build POS Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 POS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build installer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\wburger_pos.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: W-Burger-POS-Installer
          path: installer-output/W-Burger-POS-Setup.exe
          retention-days: 14